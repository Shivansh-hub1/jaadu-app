name: Build JAADU Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native-apk:
    name: Build JAADU Native APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Accept Android SDK Licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

      - name: Generate React Native Production Bundle
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Build Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p release
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" | grep -i "release" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          fi
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" release/JAADU-native.apk
          echo "JAADU Native APK successfully prepared!"
          ls -lh release/JAADU-native.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JAADU-Native-Android-APK
          path: release/JAADU-native.apk
          retention-days: 30

      - name: Publish GitHub Release with Native APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-native
          name: "JAADU Native Android App v1.0.0 (Pure React Native)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 📱 JAADU (Pure React Native Android Edition)

            Official **100% Native Android** application for Coursaa Plus.

            ### ✨ Native Features:
            - **True Native Architecture:** Built from scratch with React Native 0.88 & pure Android views (Zero WebView).
            - **Native Video Player:** Hardware-accelerated ExoPlayer (`react-native-video`) with custom speed control (0.75x - 2x), 10s skip, and interactive curriculum drawer.
            - **Offline Storage & Downloads:** Direct file system downloader (`react-native-blob-util`) saving full lectures to device storage. Watch offline anywhere with 0 internet.
            - **Native Notifications:** Powered by `@notifee/react-native` with download completion alerts and daily streak reminders.
            - **Offline-First Catalog:** All 5,700+ lectures bundled natively with instant search and category filtering.
            - **Study Tracker:** Track hours studied, current streak, and placement targets.

            ---
            ### 📥 Installation:
            1. Download **`JAADU-native.apk`** below on your Android phone.
            2. Tap **Install** (allow unknown sources if prompted).
            3. Enjoy a fast, smooth, native learning experience!
          files: release/JAADU-native.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
